<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="/spor.js"></script>
  <title>Quinn</title>
  <meta name="robots" content="noindex" />
  <script>
    // Referral links (quinn.live/rs/CODE) land here because GitHub Pages has no
    // server-side routing — this doubles as an invisible redirector:
    //  - App installed → Android App Links / iOS Universal Links open the app
    //    before the browser loads anything (see /.well-known/).
    //  - Otherwise → the right store for the visitor's OS:
    //      Android → Play Store; the code rides along as the install referrer
    //                (quinn_ref) and the app auto-fills it on first launch.
    //      iOS     → App Store; there is no install-referrer equivalent, so the
    //                user types the 6-letter code from the share message.
    var m = location.pathname.match(/^\/rs\/([A-Za-z0-9]{4,12})\/?$/);
    if (m) {
      var code = m[1].toUpperCase();
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ reports as desktop Safari — detect the touch Mac.
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        location.replace('https://apps.apple.com/app/id6789599518');
      } else {
        location.replace(
          'https://play.google.com/store/apps/details?id=live.quinn.sage' +
          '&referrer=' + encodeURIComponent('quinn_ref=' + code)
        );
      }
    }
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #0c0b0f; color: #f5f1ea;
      font-family: "Inter", -apple-system, sans-serif; text-align: center;
    }
    a { color: #ec9fb8; }
  </style>
</head>
<body>
  <p>Page not found. <a href="/">Go to quinn.live</a></p>
</body>
</html>
